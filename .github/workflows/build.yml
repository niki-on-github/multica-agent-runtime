name: Build and publish images

# Builds ghcr.io/<owner>/<repo> in two variants (cpu, cuda) from one Dockerfile. Tags follow the
# Multica backend tag the Dockerfile copies the CLI from:
#   :<multica-version>-<variant>          moving, rebuilt on every change
#   :<multica-version>-<variant>-<sha7>   immutable, one per commit (pin this, by digest)
#   :<variant>                            latest
# Renovate batches all updates into one PR and automerges it. Every push to main builds, runs the
# smoke tests (plain, rootful Docker, rootless Docker) and only then pushes, so a broken update
# never replaces the published tags. Docs-only pushes (paths-ignore) do not build. The weekly schedule picks up Ubuntu security updates.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "renovate.json"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, cuda]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve tags
        id: meta
        run: |
          MULTICA_TAG=$(sed -nE 's|^FROM ghcr\.io/multica-ai/multica-backend:([^@[:space:]]+).*|\1|p' Dockerfile)
          [ -n "$MULTICA_TAG" ] || { echo "no multica-backend stage in Dockerfile" >&2; exit 1; }
          IMAGE=${IMAGE,,}
          V=${{ matrix.variant }}
          {
            echo "multica_tag=$MULTICA_TAG"
            echo "image=$IMAGE"
            echo "tags<<EOT"
            echo "$IMAGE:$MULTICA_TAG-$V"
            echo "$IMAGE:$MULTICA_TAG-$V-${GITHUB_SHA::7}"
            echo "$IMAGE:$V"
            echo "EOT"
          } >> "$GITHUB_OUTPUT"

      - name: Free disk space
        if: matrix.variant == 'cuda'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # One build, loaded into the local engine with the final tags; pushed after the tests.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          build-args: VARIANT=${{ matrix.variant }}
          load: true
          tags: |
            agent-runtime:test
            ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.multica_tag }}-${{ matrix.variant }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Prepare smoke tests
        run: |
          mkdir -p out/plain out/rootful out/rootless
          chmod -R 0777 out
          # Ubuntu runners block unprivileged user namespaces through AppArmor (the cluster nodes do not)
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # uid 1000, empty home, no Docker
      - name: Smoke test (plain)
        run: |
          docker run --rm \
            --tmpfs /home/agent:uid=1000,gid=1000,exec \
            -v "$PWD/tests:/tests:ro" -v "$PWD/out/plain:/out" \
            -e SMOKE_OUT=/out \
            agent-runtime:test /tests/smoke.sh

      # privileged, started as root: entrypoint starts dockerd, then drops to the agent
      - name: Smoke test (rootful Docker)
        run: |
          docker run --rm --privileged --user 0 \
            --tmpfs /home/agent:uid=1000,gid=1000,exec \
            -v smoke-rootful:/data \
            -v "$PWD/tests:/tests:ro" -v "$PWD/out/rootful:/out" \
            -e DIND_MODE=rootful -e SMOKE_DIND=1 -e SMOKE_SANDBOX=1 -e SMOKE_OUT=/out \
            agent-runtime:test /tests/smoke.sh

      # unprivileged uid 1000 with what the cluster pod gets (see docs/kubernetes.md)
      - name: Smoke test (rootless Docker)
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --security-opt systempaths=unconfined \
            --cap-add SYS_ADMIN \
            --device /dev/net/tun \
            --tmpfs /home/agent:uid=1000,gid=1000,exec \
            -v smoke-rootless:/data \
            -v "$PWD/tests:/tests:ro" -v "$PWD/out/rootless:/out" \
            -e DIND_MODE=auto -e SMOKE_DIND=1 -e SMOKE_SANDBOX=1 -e SMOKE_OUT=/out \
            agent-runtime:test /tests/smoke.sh

      - name: Upload smoke test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ matrix.variant }}
          path: out/
          if-no-files-found: ignore
          retention-days: 14

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.ref == 'refs/heads/main'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker push --quiet "$tag"
          done <<< "$TAGS"

      - name: Summary
        if: github.ref == 'refs/heads/main'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          first=$(head -n1 <<< "$TAGS")
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$first")
          {
            echo "## ${{ matrix.variant }}"
            echo '```'
            echo "${first}@${digest#*@}"
            echo '```'
            echo '<details><summary>versions</summary>'
            echo
            echo '```json'
            docker run --rm --entrypoint cat agent-runtime:test /etc/multica-agent-runtime/versions.json
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
