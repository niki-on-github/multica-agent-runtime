# Persistent session `main` (`tmux new -A -s main`): web shell with `?arg=tmux`, or kubectl exec.
set -g default-shell /bin/bash
set -g default-command "bash -l"
set -g default-terminal "tmux-256color"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g status-right ' multica-agent %H:%M'
